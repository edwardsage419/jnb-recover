name: Bootstrap repository labels

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-labels.yml']

permissions:
  contents: read
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update project labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess

          repo = os.environ['REPO']
          labels = [
              ('compatibility', 'JNB compatibility or version-specific behavior / JNB 兼容性或版本相关行为', '1D76DB'),
              ('scientific-validation', 'Scientific validation evidence or ground truth / 科学验证证据或 ground truth', '0E8A16'),
              ('needs-fixture', 'Requires a reproducible fixture or independent evidence / 需要可复现 fixture 或独立证据', 'FBCA04'),
              ('unsupported-format', 'Unsupported JNB serialization or content / 未支持的 JNB 序列化或内容', 'D93F0B'),
              ('scientific-warning', 'Ambiguous scientific state requiring conservative handling / 需要保守处理的科学歧义状态', 'B60205'),
              ('documentation', 'Documentation improvement / 文档改进', '0075CA'),
              ('ios', 'iPhone, iPad, Pyto, or iOS workflow / iPhone、iPad、Pyto 或 iOS 工作流', '5319E7'),
              ('desktop', 'Desktop or command-line workflow / 桌面或命令行工作流', 'C5DEF5'),
              ('help-wanted', 'Community help is useful / 欢迎社区协助', '008672'),
              ('good-first-issue', 'Suitable for a first contribution / 适合作为首次贡献', '7057FF'),
              ('scope-review', 'Requires review against the frozen project scope / 需要根据冻结项目范围审查', 'D4C5F9'),
          ]
          for name, description, color in labels:
              payload = json.dumps({'name': name, 'description': description, 'color': color})
              get = subprocess.run(['gh','api',f'repos/{repo}/labels/{name}'], capture_output=True)
              if get.returncode == 0:
                  subprocess.run(['gh','api','--method','PATCH',f'repos/{repo}/labels/{name}','--input','-'], input=payload.encode(), check=True)
              else:
                  subprocess.run(['gh','api','--method','POST',f'repos/{repo}/labels','--input','-'], input=payload.encode(), check=True)
          print('Repository labels bootstrapped successfully.')
          PY